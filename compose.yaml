services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ORIGIN: http://localhost:8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    volumes:
      - documents:/app/storage
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - models:/root/.ollama
    restart: unless-stopped
volumes:
  documents:
  models:
