name: Document intelligence checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app.js
